<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCC Hub - Pro</title>
    <style>
        /* Manter seu design P&B original */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --black: #000000; --white: #FFFFFF;
            --gray-100: #f5f5f5; --gray-300: #e0e0e0;
            --gray-700: #616161; --gray-900: #212121;
        }
        body { font-family: -apple-system, sans-serif; background: var(--gray-100); color: var(--gray-900); }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 2px solid var(--black); margin-bottom: 30px; }
        .logo { font-size: 28px; font-weight: bold; cursor: pointer; }
        .nav-link { margin-left: 20px; cursor: pointer; text-decoration: none; color: var(--gray-700); font-weight: 500; }
        .nav-link.active { color: var(--black); border-bottom: 2px solid var(--black); }

        .section { display: none; }
        .section.active { display: block; }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--white); border: 1px solid var(--gray-300); padding: 20px; transition: 0.2s; position: relative; }
        .card:hover { border-color: var(--black); transform: translateY(-3px); }
        
        /* Novas Funcionalidades CSS */
        .stats-badge { font-size: 12px; color: var(--gray-700); display: flex; gap: 10px; margin-top: 10px; }
        .comment-section { margin-top: 30px; border-top: 1px solid var(--gray-300); padding-top: 20px; }
        .comment-item { background: #f9f9f9; padding: 10px; margin-bottom: 10px; border-left: 3px solid var(--black); }
        .comment-author { font-weight: bold; font-size: 14px; }
        
        .btn { display: inline-block; padding: 10px 20px; border: 2px solid var(--black); background: var(--white); cursor: pointer; font-weight: 600; text-align: center; }
        .btn:hover { background: var(--black); color: var(--white); }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid var(--gray-300); margin-top: 5px; }
        .form-container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border: 1px solid var(--gray-300); }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav">
            <span class="logo" onclick="mostrarSecao('inicio')">TCC HUB</span>
            <div id="nav-links"></div>
        </nav>

        <section id="inicio" class="section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1>Destaques Acadêmicos</h1>
                <div id="welcome-msg"></div>
            </div>
            <div class="card-grid" id="feed-cards"></div>
        </section>

        <section id="explorar" class="section">
            <div style="display: flex; gap: 10px; margin-bottom: 30px;">
                <input type="text" id="busca" placeholder="Pesquisar título ou autor...">
                <select id="filtro-curso" style="width: 250px;"><option value="">Todos os cursos</option></select>
            </div>
            <div class="card-grid" id="explorar-cards"></div>
        </section>

        <section id="tcc-view" class="section">
            <button class="btn" onclick="mostrarSecao('explorar')">← Voltar</button>
            <div id="tcc-detalhes" style="background: white; padding: 40px; margin-top: 20px; border: 1px solid #ddd;">
                </div>
            
            <div class="comment-section">
                <h3>Comentários e Críticas</h3>
                <div id="lista-comentarios" style="margin: 20px 0;"></div>
                <div id="box-comentario">
                    <textarea id="novo-comentario" placeholder="Escreva sua análise técnica..."></textarea>
                    <button class="btn" style="margin-top: 10px;" onclick="postarComentario()">Enviar Comentário</button>
                </div>
            </div>
        </section>

        <section id="publicar" class="section">
            <div class="form-container">
                <h2>Enviar Novo Trabalho</h2>
                <form id="form-publicar">
                    <label>Título</label><input type="text" id="pub-titulo" required>
                    <label>Resumo</label><textarea id="pub-resumo" rows="5" required></textarea>
                    <label>Link do PDF</label><input type="url" id="pub-pdf" required>
                    <button type="submit" class="btn" style="width: 100%; margin-top: 20px;">Submeter para Aprovação</button>
                </form>
            </div>
        </section>

        </div>

    <script>
        let tccs = [];
        let usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'));
        let todosComentarios = JSON.parse(localStorage.getItem('db_comentarios') || '{}');

        // Carregar JSON Resiliente
        async function init() {
            try {
                const res = await fetch('./data/tccs.json');
                const data = await res.json();
                tccs = Array.isArray(data) ? data : (data.tccs || [data]);
            } catch (e) {
                console.error("Erro ao carregar JSON");
            }
            atualizarMenu();
            mostrarSecao(usuarioLogado ? 'inicio' : 'explorar');
        }

        function mostrarSecao(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'inicio') renderizarFeed();
            if(id === 'explorar') renderizarExplorar();
        }

        function renderizarFeed() {
            const container = document.getElementById('feed-cards');
            // Ordenar por visualizações ou id (mais recentes)
            const lista = [...tccs].reverse().slice(0, 6);
            container.innerHTML = lista.map(t => cardHTML(t)).join('');
        }

        function cardHTML(t) {
            return `
                <div class="card">
                    <h3>${t.titulo}</h3>
                    <p><small>${t.autor} | ${t.curso}</small></p>
                    <div class="stats-badge">
                        <span>👁️ ${t.views || 0}</span>
                        <span>💬 ${todosComentarios[t.id]?.length || 0}</span>
                    </div>
                    <button class="btn btn-sm" style="margin-top:10px" onclick="abrirTCC(${t.id})">Analisar</button>
                </div>
            `;
        }

        function abrirTCC(id) {
            const t = tccs.find(item => item.id == id);
            if(!t) return;
            
            // Incrementar views (localmente)
            t.views = (t.views || 0) + 1;
            
            const detalhes = document.getElementById('tcc-detalhes');
            detalhes.innerHTML = `
                <h1>${t.titulo}</h1>
                <p><strong>Orientador:</strong> ${t.orientador || 'N/A'}</p>
                <hr style="margin:20px 0">
                <p style="font-size: 1.1em;">${t.resumo}</p>
                <a href="${t.pdf_url}" target="_blank" class="btn" style="margin-top:20px">Baixar Trabalho Acadêmico</a>
            `;
            
            window.currentTccId = id;
            renderizarComentarios(id);
            mostrarSecao('tcc-view');
        }

        function renderizarComentarios(tccId) {
            const lista = document.getElementById('lista-comentarios');
            const comments = todosComentarios[tccId] || [];
            lista.innerHTML = comments.length ? comments.map(c => `
                <div class="comment-item">
                    <p class="comment-author">${c.user}</p>
                    <p>${c.text}</p>
                    <small>${c.date}</small>
                </div>
            `).join('') : '<p>Ainda não há debates sobre este trabalho.</p>';
        }

        function postarComentario() {
            if(!usuarioLogado) return alert("Faça login para comentar");
            const text = document.getElementById('novo-comentario').value;
            if(!text) return;

            const tccId = window.currentTccId;
            if(!todosComentarios[tccId]) todosComentarios[tccId] = [];
            
            todosComentarios[tccId].push({
                user: usuarioLogado.nome,
                text: text,
                date: new Date().toLocaleDateString()
            });

            localStorage.setItem('db_comentarios', JSON.stringify(todosComentarios));
            document.getElementById('novo-comentario').value = '';
            renderizarComentarios(tccId);
            
            // Dica: No admin.html você poderá ver esses comentários para fixar no JSON
        }

        function atualizarMenu() {
            const links = document.getElementById('nav-links');
            if(usuarioLogado) {
                links.innerHTML = `
                    <span class="nav-link" onclick="mostrarSecao('inicio')">Início</span>
                    <span class="nav-link" onclick="mostrarSecao('explorar')">Explorar</span>
                    <span class="nav-link" onclick="mostrarSecao('publicar')">Publicar</span>
                    <span class="nav-link" onclick="logout()" style="color:red">Sair</span>
                `;
            } else {
                links.innerHTML = `<span class="nav-link" onclick="window.location.reload()">Entrar</span>`;
            }
        }

        init();
    </script>
</body>
</html>
